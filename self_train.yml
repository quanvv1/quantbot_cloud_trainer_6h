name: QuantBot Cloud Training
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours at minute 0 (UTC)
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing results back to repo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps for Research Lab
        run: |
          python -m pip install --upgrade pip
          pip install -r quantbot_research_lab/requirements.txt

      - name: Run training (6h cadence)
        run: |
          python quantbot_research_lab/run_training.py --symbols "BTCUSDT,PENGUUSDT,PUMPUSDT,WLFIUSDT,ASTERUSDT" --episodes 40 --out research_out

      - name: Commit & push updated weights and leaderboard
        run: |
          git config user.name "QuantBot Trainer"
          git config user.email "bot@users.noreply.github.com"
          git add research_out/leaderboard.csv || true
          git add research_out/learned_weights.json || true
          git add research_out/results_ep_*.csv || true
          git commit -m "Auto-update: QuantBot training results (6h)" || echo "No changes to commit"
          git push
